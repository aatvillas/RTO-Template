name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon -Pvc=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk RTO-Report.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: RTO-Report-apk
          path: RTO-Report.apk

      - name: Publish to the "latest" release (download link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RTO-Report.apk \
            --title "RTO Report – latest (build ${{ github.run_number }})" \
            --notes "Download RTO-Report.apk on your Android phone and open it to install or update."
