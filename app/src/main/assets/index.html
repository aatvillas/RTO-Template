:root{
  --ink:#0f1f33; --muted:#5a6b80; --line:#d7e0ea; --bg:#f2f5f9; --card:#fff;
  --brand:#0f4172; --brand2:#1d5a9a; --accent:#e8a33d; --ok:#1d7a4f; --bad:#b3261e;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Lora",Georgia,serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header .ttl{flex:1;min-width:0}
header h1{font-size:17px;margin:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:12px;opacity:.75;margin-top:1px;letter-spacing:.02em}
.badge{width:34px;height:34px;flex:0 0 34px;display:block}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
main{max-width:640px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 110px)}
.status{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin:2px 2px 12px}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa7b6}
.dot.on{background:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:left;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.tile:active{transform:scale(.98);background:#ebf1f8}
.tile b{font-size:15px;line-height:1.25}
.tile span{font-size:12px;color:var(--muted)}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.tile .ic svg{width:24px;height:24px}
.section{margin:22px 2px 8px;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
label.f{display:block;margin:0 0 12px}
label.f>span{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;margin-bottom:5px;color:#23395a}
input.t,select.t,textarea.t{width:100%;border:1px solid #c3cfdd;background:#fbfcfe;border-radius:10px;padding:11px 12px;outline:none;min-height:46px}
textarea.t{min-height:70px;resize:vertical}
input.t:focus,select.t:focus,textarea.t:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(29,90,154,.16);background:#fff}
select.t{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#5a6b80 50%),linear-gradient(135deg,#5a6b80 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.other{margin-top:6px}
.chip{border:1px solid #c3cfdd;background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--brand2);cursor:pointer}
.msgbox{font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:230px;background:#f6f8fb}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12.5px;color:var(--muted)}
.warn{color:#8a5300}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;justify-content:center}
.actions .in{max-width:640px;width:100%;display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;min-height:48px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--brand2);color:#fff}
.btn.sec{background:#e3ebf5;color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.btn.small{flex:0 0 auto;min-height:36px;font-size:13.5px;border-radius:10px}
.op{display:flex;gap:6px;flex-wrap:wrap}
.op button{border:1px solid #c3cfdd;background:#fff;border-radius:9px;padding:7px 9px;font-size:13px;font-weight:700;cursor:pointer;min-width:52px}
.op button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(20px);opacity:0;transition:.2s;background:#0f1f33;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--bad)}
.logitem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.logitem .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.logitem .top b{color:var(--ink);font-size:14.5px}
.logitem pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 10px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f6f8fb;border-radius:8px;padding:9px;max-height:7.4em;overflow:hidden;position:relative;cursor:pointer}
.logitem pre.open{max-height:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 12px;scrollbar-width:none}
.filters button{flex:0 0 auto;border:1px solid #c3cfdd;background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.filters button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.modal{position:fixed;inset:0;background:rgba(10,25,30,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.show{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 6px;font-size:17px}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
[hidden]{display:none!important}
</style>
</head>

function buildMessage(r,vals){

/* ---------- Log storage: shared db when available, else this phone ---------- */
const Store={mode:"local",entries:LS.get("rto_log",[]),listeners:[],db:null,
  notify(){this.listeners.forEach(f=>f())},
  async add(e){
    if(this.db){await this.db.collection("log").add(e);return}
    const next=[{...e,id:"l"+e.ts},...this.entries];if(!LS.set("rto_log",next))throw{code:"local_full"};this.entries=next;this.notify();
  },
  async remove(id){
    if(this.db){await this.db.collection("log").doc(id).delete();return}
    this.entries=this.entries.filter(x=>x.id!==id);LS.set("rto_log",this.entries);this.notify();
  }
};
(async()=>{
  if(!window.claude||!window.claude.use) return;
  let db=null;try{db=await window.claude.use("db")}catch(e){}
  if(!db) return;
  Store.db=db;Store.mode="shared";Store.loading=true;Store.notify();
  const timer=setTimeout(()=>{Store.stale=true;Store.notify()},10000);
  db.collection("log").orderBy("ts","desc").limit(1000).onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);Store.stale=false}
    Store.loading=false;
    Store.entries=snap.docs.map(d=>({id:d.id,...d.data()}));Store.notify();
  },err=>{clearTimeout(timer);Store.loading=false;Store.err=err&&err.code;Store.notify()});
})();

/* ---------- Excel export (.xlsx, like ExportMessageLog) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const [name,str] of files){
    const nb=enc.encode(name),data=enc.encode(str),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint16(10,0,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
    h.setUint16(26,nb.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nb,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);
    c.setUint16(12,0,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
    c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),nb);
    off+=30+nb.length+data.length;
  }
  const csize=cen.reduce((a,b)=>a+b.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)]);
}
const x=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
function buildXlsx(entries){
  const rows=[...entries].sort((a,b)=>a.ts-b.ts);
  const istr=(ref,s,st)=>`<c r="${ref}" t="inlineStr" s="${st}"><is><t xml:space="preserve">${x(s)}</t></is></c>`;
  let sd=`<row r="1">${["Date","Time","Report","Message","Operator"].map((h,i)=>istr("ABCDE"[i]+"1",h,1)).join("")}</row>`;
  rows.forEach((e,i)=>{const r=i+2,d=new Date(e.ts);
    const serial=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000+25569;
    const frac=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400;
    sd+=`<row r="${r}"><c r="A${r}" s="2"><v>${serial}</v></c><c r="B${r}" s="3"><v>${frac}</v></c>${istr("C"+r,e.report,4)}${istr("D"+r,e.message,4)}${istr("E"+r,e.operator,4)}</row>`});
  const sheet=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="10" customWidth="1"/><col min="3" max="3" width="28" customWidth="1"/><col min="4" max="4" width="62" customWidth="1"/><col min="5" max="5" width="10" customWidth="1"/></cols><sheetData>${sd}</sheetData></worksheet>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="dd\\-mmm\\-yyyy"/><numFmt numFmtId="165" formatCode="hh:mm:ss"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyAlignment="1"><alignment vertical="top"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  return zip([
   ["[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
   ["_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
   ["xl/workbook.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Message_Log" sheetId="1" r:id="rId1"/></sheets></workbook>`],
   ["xl/_rels/workbook.xml.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
   ["xl/styles.xml",styles],
   ["xl/worksheets/sheet1.xml",sheet]]);
}
async function exportXlsx(list){
  if(!list.length) return toast("Nothing to export.",true);
  const d=new Date();
  const name=`Message_Log_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}.xlsx`;
  if(window.AndroidApp){const blob=buildXlsx(list);const r=new FileReader();
    r.onload=()=>{try{const res=AndroidApp.saveFile(name,String(r.result).split(",")[1],"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");toast(res||"Message Log exported")}catch(e){toast("Couldn't export",true)}};
    r.readAsDataURL(blob);return}
  try{await Downloads.save({filename:name,data:buildXlsx(list)});toast("Message Log exported")}
  catch(e){if(e&&e.code!=="declined")toast("Couldn't export: "+(e&&e.code||"error"),true)}
}
window.__test={REPORTS,buildMessage,buildXlsx};
render();
